name: CI

on:
  pull_request:
    branches: [main, develop, staging]
  push:
    branches: [main, develop, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-commits:
    name: Lint commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Lint PR commits
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  verify-hooks:
    name: Verify hooks installable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Confirm husky installed hooks
        run: |
          test -x .husky/pre-commit || (echo "pre-commit hook missing/not executable" && exit 1)
          test -x .husky/commit-msg || (echo "commit-msg hook missing/not executable" && exit 1)

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Run typecheck across all workspaces
        run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Build internal packages (for downstream tests)
        run: npm run build:packages

      - name: Run tests across all workspaces
        run: npm run test

  build:
    name: Build all packages
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Build everything
        run: npm run build

      - name: Upload sdk-ts artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-ts-dist
          path: sdk-ts/dist
          retention-days: 7

  web-typecheck:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Typecheck web (tsc --noEmit)
        working-directory: web
        run: npm run typecheck

  contracts:
    name: Soroban contracts (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      # The market tests embed vault.wasm via `contractimport!`, which reads the
      # file at macro-expansion time. cargo does NOT track it as a dependency, so
      # it must exist before `cargo test` compiles the market crate.
      - name: Build contract wasm (embedded by market tests)
        working-directory: contracts
        run: cargo build -p vault --target wasm32-unknown-unknown --release

      - name: cargo test --workspace
        working-directory: contracts
        run: cargo test --workspace

      - name: cargo clippy
        working-directory: contracts
        # Deny warnings. The -A allow-list covers pre-existing lints that are
        # either inherent to Soroban contract entry points (too_many_arguments)
        # or pervasive style nits (digit grouping, len_zero, clone_on_copy,
        # dead storage helpers). Burn these down separately; any NEW lint
        # category — or a real correctness lint — still fails the build.
        run: |
          cargo clippy --workspace -- -D warnings \
            -A clippy::too_many_arguments \
            -A clippy::inconsistent_digit_grouping \
            -A clippy::len_zero \
            -A clippy::clone_on_copy \
            -A dead_code

  sdk-py:
    name: Python SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sdk-py (dev extras)
        working-directory: sdk-py
        run: pip install -e ".[dev]"

      - name: pytest
        working-directory: sdk-py
        run: pytest
