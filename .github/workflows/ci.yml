name: CI

on:
  pull_request:
    branches: [main, develop, staging]
  push:
    branches: [main, develop, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-commits:
    name: Lint commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Lint PR commits
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  verify-hooks:
    name: Verify hooks installable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Confirm husky installed hooks
        run: |
          test -x .husky/pre-commit || (echo "pre-commit hook missing/not executable" && exit 1)
          test -x .husky/commit-msg || (echo "commit-msg hook missing/not executable" && exit 1)

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Run typecheck across all workspaces
        run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Build internal packages (for downstream tests)
        run: npm run build:packages

      - name: Run tests across all workspaces
        run: npm run test

  build:
    name: Build all packages
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Build everything
        run: npm run build

      - name: Upload sdk-ts artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-ts-dist
          path: sdk-ts/dist
          retention-days: 7

  contracts:
    name: Contract tests & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to match contracts/rust-toolchain.toml — floating `@stable`
      # introduced a new clippy lint (manual_checked_ops in 1.96) that broke
      # CI while passing on older local clippy. Bump both together.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      # The market test module embeds the vault contract via
      # contractimport!(../target/wasm32-unknown-unknown/release/vault.wasm)
      # and registers it with vault::WASM, so that file must exist before
      # `cargo test`/`clippy` compile the market tests.
      - name: Build vault WASM (imported by market tests)
        working-directory: contracts
        run: cargo build --release --target wasm32-unknown-unknown -p vault

      - name: Run contract tests
        working-directory: contracts
        run: cargo test --workspace

      - name: Run clippy
        working-directory: contracts
        run: cargo clippy --workspace --all-targets -- -D warnings

  web:
    name: Web typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the web app's engines pin + Vercel/.nvmrc (Node 22 LTS).
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        # Pinned to npm 10: web/package-lock.json is npm-10-generated, and
        # newer npm majors prune optional/nested entries that npm 10's
        # `npm ci` then reports as "Missing" (EUSAGE). Pinning the install
        # tool makes this job independent of whatever npm the runner's Node
        # bundles — and of whatever npm regenerated the lock locally.
        run: npx -y npm@10 ci

      - name: Typecheck web
        run: npx tsc --noEmit

  sdk-py:
    name: Python SDK tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sdk-py with dev + stellar deps
        run: pip install -e ".[dev,stellar]"

      - name: Run pytest
        run: pytest
