<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 792" role="img" aria-labelledby="noether-arch-dark-title noether-arch-dark-desc" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif">
<title id="noether-arch-dark-title">Noether system architecture</title>
<desc id="noether-arch-dark-desc">Architecture diagram: six Soroban contracts on Stellar testnet (router, market, vault, vault factory, referral, Noeracle oracle), fed by an Azure keeper bot and indexed into Postgres for a Fastify API gateway that serves the Next.js frontend and the TypeScript and Python SDKs. User trades enter through the router, which relays a signed Noeracle price and calls the market in the same transaction.</desc>
