<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" role="img" aria-labelledby="noether-oracle-light-title noether-oracle-light-desc" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif">
<title id="noether-oracle-light-title">Noeracle price chain</title>
<desc id="noether-oracle-light-desc">Data-flow diagram: the Noeracle service signs price rounds off-chain; the keeper publishes attestations to the Noeracle contract; the SEP-40 shim exposes lastprice to the market. For user trades the Noether router relays a fresh signed price and calls the market in the same transaction, so the market's 60-second staleness gate never trips.</desc>
