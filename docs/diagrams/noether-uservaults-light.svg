<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" role="img" aria-labelledby="noether-uservaults-light-title noether-uservaults-light-desc" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif">
<title id="noether-uservaults-light-title">User-created vaults</title>
<desc id="noether-uservaults-light-desc">Sequence diagram: a leader creates a vault via the vault factory, depositors receive shares priced at NAV, the leader trades the shared collateral through proxied calls to the market, and withdrawals pay pro-rata NAV minus the leader's profit share above the high-water mark; a 5 percent leader minimum holding is enforced on every withdraw.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4d5766"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a16207"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4d5766" stroke-width="1.2"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f6f7f9"/>
<rect x="48" y="24" width="160" height="48" rx="6" fill="#f6f7f9"/>
<rect x="48" y="24" width="160" height="48" rx="6" fill="rgba(77,87,102,0.10)" stroke="#707a89" stroke-width="1"/>
<text x="128" y="45" fill="#1c2127" font-size="12" font-weight="600" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Leader</text>
<text x="128" y="61" fill="#4d5766" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">runs the strategy</text>
<rect x="304" y="24" width="160" height="48" rx="6" fill="#f6f7f9"/>
<rect x="304" y="24" width="160" height="48" rx="6" fill="rgba(77,87,102,0.10)" stroke="#707a89" stroke-width="1"/>
<text x="384" y="45" fill="#1c2127" font-size="12" font-weight="600" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Depositor</text>
<text x="384" y="61" fill="#4d5766" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">holds shares</text>
<rect x="536" y="24" width="160" height="48" rx="6" fill="#f6f7f9"/>
<rect x="536" y="24" width="160" height="48" rx="6" fill="#ffffff" stroke="#1c2127" stroke-width="1"/>
<text x="616" y="45" fill="#1c2127" font-size="12" font-weight="600" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Vault Factory</text>
<text x="616" y="61" fill="#4d5766" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">shares · NAV · HWM</text>
<rect x="752" y="24" width="160" height="48" rx="6" fill="#f6f7f9"/>
<rect x="752" y="24" width="160" height="48" rx="6" fill="#ffffff" stroke="#1c2127" stroke-width="1"/>
<text x="832" y="45" fill="#1c2127" font-size="12" font-weight="600" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Market</text>
<text x="832" y="61" fill="#4d5766" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">positions</text>
