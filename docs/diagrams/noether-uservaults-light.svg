<path d="M 620,344 L 648,344 Q 656,344 656,352 L 656,352 Q 656,360 648,360 L 624,360" fill="none" stroke="#4d5766" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="668" y="355" fill="#4d5766" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.06em">CHECK 5% LEADER MIN-HOLD</text>
<line x1="612" y1="408" x2="388" y2="408" stroke="#4d5766" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="434" y="388" width="132" height="12" rx="2" fill="#f6f7f9"/>
<text x="500" y="397" fill="#4d5766" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">USDC · NAV − PROFIT SHARE</text>
<text x="912" y="456" fill="#707a89" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, serif" text-anchor="end">profit share accrues only above the high-water mark</text>
<line x1="40" y1="488" x2="920" y2="488" stroke="rgba(28,33,39,0.10)" stroke-width="0.8"/>
<text x="40" y="504" fill="#4d5766" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.18em">LEGEND</text>
<line x1="40" y1="522" x2="68" y2="522" stroke="#4d5766" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="76" y="524" fill="#4d5766" font-size="8.5" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif">Call</text>
<line x1="120" y1="522" x2="148" y2="522" stroke="#4d5766" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
