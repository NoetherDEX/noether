<line x1="612" y1="184" x2="388" y2="184" stroke="#4d5766" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="466" y="164" width="68" height="12" rx="2" fill="#f6f7f9"/>
<text x="500" y="173" fill="#4d5766" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">SHARES @ NAV</text>
<line x1="132" y1="232" x2="612" y2="232" stroke="#4d5766" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="390" y="212" width="92" height="12" rx="2" fill="#f6f7f9"/>
