<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 616" role="img" aria-labelledby="noether-poslife-light-title noether-poslife-light-desc" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif">
<title id="noether-poslife-light-title">Position lifecycle</title>
<desc id="noether-poslife-light-desc">Sequence diagram: a trader opens a position on the market contract, which reads the oracle price, locks collateral in the vault and returns the position; later the trader closes, the market computes PnL plus pending funding, settles with the vault and returns USDC to the trader.</desc>
