<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" role="img" aria-labelledby="noether-vault-dark-title noether-vault-dark-desc" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif">
<title id="noether-vault-dark-title">Protocol vault flow</title>
<desc id="noether-vault-dark-desc">Diagram of the LP loop: liquidity providers deposit USDC into the vault and receive NOE, the pre-minted SAC LP token; the market settles trader PnL and fees against the vault; withdrawals burn NOE for a pro-rata share of AUM.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ba1a8"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eab308"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b9bf8"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#9ba1a8" stroke-width="1.2"/></marker>
</defs>
<rect width="100%" height="100%" fill="#0b0d10"/>
<line x1="256" y1="112" x2="392" y2="112" stroke="#eab308" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<line x1="392" y1="144" x2="256" y2="144" stroke="#9ba1a8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<line x1="456" y1="160" x2="456" y2="248" stroke="#9ba1a8" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="520" y1="248" x2="520" y2="160" stroke="#9ba1a8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<line x1="704" y1="128" x2="584" y2="128" stroke="#9ba1a8" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="290" y="92" width="68" height="12" rx="2" fill="#0b0d10"/>
<text x="324" y="101" fill="#eab308" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">DEPOSIT USDC</text>
<rect x="272" y="124" width="104" height="12" rx="2" fill="#0b0d10"/>
<text x="324" y="133" fill="#9ba1a8" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">WITHDRAW · PRO-RATA</text>
<rect x="400" y="196" width="44" height="12" rx="2" fill="#0b0d10"/>
<text x="404" y="205" fill="#9ba1a8" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.06em">NOE OUT</text>
<rect x="532" y="196" width="88" height="12" rx="2" fill="#0b0d10"/>
<text x="536" y="205" fill="#9ba1a8" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.06em">APPROVE + RETURN</text>
<rect x="598" y="108" width="92" height="12" rx="2" fill="#0b0d10"/>
<text x="644" y="117" fill="#9ba1a8" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">SETTLE PNL · FEES</text>
<rect x="80" y="96" width="176" height="64" rx="6" fill="#0b0d10"/>
<rect x="80" y="96" width="176" height="64" rx="6" fill="rgba(155,161,168,0.10)" stroke="#7d858e" stroke-width="1"/>
<rect x="88" y="104" width="24" height="12" rx="2" fill="transparent" stroke="rgba(232,234,237,0.22)" stroke-width="0.8"/>
<text x="100" y="113" fill="#7d858e" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">LP</text>
<text x="168" y="132" fill="#e8eaed" font-size="12" font-weight="600" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Liquidity Provider</text>
<text x="168" y="148" fill="#9ba1a8" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">any Stellar wallet</text>
<rect x="392" y="96" width="192" height="64" rx="6" fill="#0b0d10"/>
<rect x="392" y="96" width="192" height="64" rx="6" fill="rgba(234,179,8,0.10)" stroke="#eab308" stroke-width="1"/>
<rect x="400" y="104" width="24" height="12" rx="2" fill="transparent" stroke="rgba(234,179,8,0.50)" stroke-width="0.8"/>
<text x="412" y="113" fill="#eab308" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">LP</text>
<text x="488" y="132" fill="#e8eaed" font-size="12" font-weight="600" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Vault</text>
<text x="488" y="148" fill="#9ba1a8" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">AUM · NOE price</text>
<rect x="704" y="96" width="176" height="64" rx="6" fill="#0b0d10"/>
<rect x="704" y="96" width="176" height="64" rx="6" fill="#14181e" stroke="#e8eaed" stroke-width="1"/>
<rect x="712" y="104" width="32" height="12" rx="2" fill="transparent" stroke="rgba(232,234,237,0.22)" stroke-width="0.8"/>
<text x="728" y="113" fill="#9ba1a8" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
<text x="792" y="132" fill="#e8eaed" font-size="12" font-weight="600" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Market</text>
<text x="792" y="148" fill="#9ba1a8" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">trader PnL source</text>
<rect x="392" y="248" width="192" height="64" rx="6" fill="#0b0d10"/>
<rect x="392" y="248" width="192" height="64" rx="6" fill="rgba(232,234,237,0.05)" stroke="#9ba1a8" stroke-width="1"/>
<rect x="400" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(232,234,237,0.22)" stroke-width="0.8"/>
<text x="414" y="265" fill="#9ba1a8" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">SAC</text>
<text x="488" y="284" fill="#e8eaed" font-size="12" font-weight="600" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">NOE Token</text>
<text x="488" y="300" fill="#9ba1a8" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">pre-minted supply</text>
<text x="920" y="264" fill="#7d858e" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, serif" text-anchor="end">AUM = deposits + fees − trader PnL</text>
<text x="920" y="284" fill="#7d858e" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, serif" text-anchor="end">NOE price = AUM / circulating NOE</text>
<line x1="40" y1="352" x2="920" y2="352" stroke="rgba(232,234,237,0.10)" stroke-width="0.8"/>
<text x="40" y="368" fill="#9ba1a8" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="380" width="14" height="10" rx="2" fill="rgba(234,179,8,0.10)" stroke="#eab308" stroke-width="1"/>
<text x="60" y="388" fill="#9ba1a8" font-size="8.5" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif">Vault</text>
<rect x="112" y="380" width="14" height="10" rx="2" fill="rgba(155,161,168,0.10)" stroke="#7d858e" stroke-width="1"/>
<text x="132" y="388" fill="#9ba1a8" font-size="8.5" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif">LP</text>
<rect x="168" y="380" width="14" height="10" rx="2" fill="rgba(232,234,237,0.05)" stroke="#9ba1a8" stroke-width="1"/>
<text x="188" y="388" fill="#9ba1a8" font-size="8.5" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif">LP token (SAC)</text>
<rect x="284" y="380" width="14" height="10" rx="2" fill="#14181e" stroke="#e8eaed" stroke-width="1"/>
<text x="304" y="388" fill="#9ba1a8" font-size="8.5" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif">Market</text>
<line x1="360" y1="386" x2="388" y2="386" stroke="#eab308" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<text x="396" y="388" fill="#9ba1a8" font-size="8.5" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif">Deposit</text>
<line x1="456" y1="386" x2="484" y2="386" stroke="#9ba1a8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="492" y="388" fill="#9ba1a8" font-size="8.5" font-family="Inter, 'Geist', 'Helvetica Neue', Arial, sans-serif">Withdraw / return</text>
</svg>
